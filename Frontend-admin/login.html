<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Portfolio Ragunathan-Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="login-body">

<div class="login-card">
  <div class="brand-mark">AK</div>
  <h1>Sign in</h1>
  <p class="lede">Control panel access — this is separate from your public page.</p>

  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <div id="loginError" class="form-error"></div>
    <button class="btn btn-primary" type="submit" style="width:100%;">Sign in</button>
  </form>

  <form id="otpForm" style="display:none;">
    <div class="field">
      <label>6-digit code from Google Authenticator</label>
      <input type="text" id="otp" maxlength="6" placeholder="000000" required >
    </div>
    <div id="otpError" class="form-error"></div>
    <button class="btn btn-primary" type="submit" style="width:100%;">Verify</button>
  </form>
</div>

<script type="module" src="/src/login.js"></script>
</body>
</html>
