<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control panel — Portfolio Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div id="authChecking" style="display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--text-soft); font-size:.9rem;">
  Checking session...
</div>

<div class="shell" id="shell" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="sidebarLogoMark">AK</div>
      <div class="brand-text">Control panel<b id="sidebarName">—</b></div>
    </div>

    <div class="nav-group-label">Page content</div>
    <ul class="navlist">
      <li><button data-panel="hero" class="active"><span class="dot"></span>Hero section</button></li>
      <li><button data-panel="about"><span class="dot"></span>About &amp; timeline</button></li>
      <li><button data-panel="skills"><span class="dot"></span>Skills</button></li>
      <li><button data-panel="projects"><span class="dot"></span>Projects</button></li>
      <li><button data-panel="certs"><span class="dot"></span>Certificates</button></li>
      <li><button data-panel="contact"><span class="dot"></span>Contact</button></li>
      <li><button data-panel="messages"><span class="dot"></span>Messages</button></li>
    </ul>

    <div class="nav-group-label">Account</div>
    <ul class="navlist">
      <li><button data-panel="account"><span class="dot"></span>Account settings</button></li>
    </ul>

    <div class="sidebar-foot">
      <a class="view-live" id="viewPublicLink" href="#" target="_blank">&#8592; Back to public page</a>
      <button id="signOutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><div class="crumb">Control panel</div><h2 id="panel-title">Hero section</h2></div>
      <div class="top-actions"><div class="status-pill" id="statusPill"><span class="dot"></span>All changes saved</div></div>
    </div>

    <div class="content">
      <section class="panel active" id="panel-hero"></section>
      <section class="panel" id="panel-about"></section>
      <section class="panel" id="panel-skills"></section>
      <section class="panel" id="panel-projects"></section>
      <section class="panel" id="panel-certs"></section>
      <section class="panel" id="panel-contact"></section>
      <section class="panel" id="panel-messages"></section>
      <section class="panel" id="panel-account"></section>
    </div>
  </main>
</div>

<script type="module" src="/src/dashboard.js"></script>
</body>
</html>
